# Asset inventory for Emaar Serenity Hills, Sector 86. Every file in images/ must be listed here.
#
# Renders and plans: from Emaar India's official Serenity Hills e-brochure
#   https://cdn.in.emaar.com/wp-content/uploads/2025/11/serenity-hills-e-brochure.pdf
# (owner confirmed authorized Emaar channel partner status on 2026-10-22). The
# brochure calls its visuals conceptual, so renders read "Artist's impression".
# The hero banner from the owner's kit is the same tower render as brochure page 4.
#
# Kit images (kit-*): supplied in the owner's kit, sourced from an agent site. Not
# matched to the brochure, so they are captioned "Representative image".
#
# Not used, on purpose:
#   - the "3 BHK floor plan" from the kit: it is a VILLA plan, not this project
#   - the kit "master plan" (320x240): it does not match Emaar's official master plan
#   - prestige-group.in images: Prestige material, not Emaar's
#   - the kit rooftop infinity pool: the brochure shows no rooftop pool, so it would
#     suggest an amenity that is not planned

