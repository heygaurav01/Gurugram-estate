faqs:
  - q: "Is Emaar Serenity Hills RERA registered?"
    a: "Yes. Phase I and Phase II are registered with HARERA as RC/REP/HARERA/GGM/993/725/2025/96 and RC/REP/HARERA/GGM/994/726/2025/97, both dated 16.10.2025. You can check them on haryanarera.gov.in."
  - q: "What home sizes are available?"
    a: "Emaar's brochure lists a 3 BHK of 948 sq ft carpet area, a 3 BHK Large of about 1,218 to 1,220 sq ft, and a 4 BHK of 1,576 sq ft, each with balconies on top. Ask us for the plan of a specific tower and floor."
  - q: "What is the price?"
    a: "Emaar shares prices on request, and they change with availability. We will send you Emaar's current official price list for the home type you want."
  - q: "How big is the project?"
    a: "The overall site is about 25.9 acres, developed in phases. The current launch has seven towers with about 1,000 homes, set around 8 acres of central greens."
  - q: "Is there a clubhouse?"
    a: "Yes, a clubhouse is planned, but Emaar states that the club will be developed in future phases. The registered phases offered today are Phase I and Phase II."
  - q: "Where is Emaar Serenity Hills?"
    a: "In Sector 86, New Gurugram, with direct frontage on the 75-metre road and links to NH-48 and the Dwarka Expressway, as shown in Emaar's brochure."
  - q: "Who are you?"
    a: "{{agent_disclosure}} We help buyers compare projects, arrange site visits and handle paperwork."

