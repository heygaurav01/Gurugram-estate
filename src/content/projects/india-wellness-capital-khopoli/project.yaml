faqs:
  - q: "What is India Wellness Capital?"
    a: "A proposed plotted township by Shapoorji Pallonji Real Estate in Khopoli, Maharashtra. Published reports describe it as about 900 acres among hills and water bodies, planned around wellness, with a first phase of about 200 acres."
  - q: "Where is it?"
    a: "In Khopoli, Maharashtra, on the corridor between Mumbai and Pune. The developer has not yet published the exact site address, so the map shows the Khopoli area. We will add travel distances only after we have measured and dated them."
  - q: "Is it registered with MahaRERA?"
    a: "{{rera_status}} You can check any Maharashtra project yourself on the MahaRERA portal, maharera.maharashtra.gov.in, by searching the project name or registration number."
  - q: "What plot sizes and prices are available?"
    a: "Figures quoted on other websites differ from one another. We will share Shapoorji Pallonji's official plot list and price list as soon as they are released for public use. Register interest to receive them first."
  - q: "Which amenities are confirmed?"
    a: "The developer has said wellness facilities will form the core of the township, with sports and adventure components in later phases. We will list specific amenities once the developer confirms them for public use."
  - q: "Can I visit the site?"
    a: "Yes. Register interest or call us and an advisor will arrange a visit with the developer's team."
  - q: "Do I need to pay anything to register interest?"
    a: "No. Registering interest is free and does not reserve a plot."
  - q: "Who are you?"
    a: "{{agent_disclosure}} We help buyers compare projects, arrange site visits and handle paperwork."

