faqs:
  - q: "Is L&T Sector 86 RERA registered?"
    a: "{{rera_status}} You can check any project yourself on the Haryana RERA website, haryanarera.gov.in."
  - q: "Who is developing L&T Sector 86, Gurgaon?"
    a: "L&T Realty, the real estate arm of Larsen and Toubro. In April 2026 it bought International Green Scapes Ltd, which holds about 19.97 acres in Sector 81 and Sector 86, Gurugram."
  - q: "Do I need to pay anything to register interest?"
    a: "No. Registering interest is free and does not reserve a unit."
  - q: "When will prices and floor plans be available?"
    a: "After the project is registered with HARERA and the developer releases official details. We will share them with registered contacts first."
  - q: "Who are you?"
    a: "{{agent_disclosure}} We help buyers compare projects, arrange site visits and handle paperwork."
  - q: "How do I verify a project's RERA registration?"
    a: "Open haryanarera.gov.in and use the project search. Search by project name, developer or registration number. Check that the registration number, developer name and project address match what you were told. If you cannot find it, ask for the registration number in writing and search again."
  - q: "Where is Sector 86?"
    a: "Sector 86 is in Gurugram, Haryana. We will add travel distances here only after we have measured and dated them."

