overview:
  title: "What we know so far"
  body:
    - "In April 2026, L&T Realty bought International Green Scapes Ltd, a company that holds about 19.97 acres of land in Sector 81 and Sector 86, Gurugram. The land is held under three residential licenses issued by the Department of Town and Country Planning, Haryana. Published reports put its development potential at about 3.6 million sq ft."
    - "We have not yet seen an official project name, home types, sizes, prices or a launch date from the developer, and the project is not registered with HARERA. Until it is, this page lists only verified progress, each item with its source."
    - "Gurugram Estate Pvt Ltd is an authorized channel partner of L&T Realty. Register interest and we will share official details, including plans and pricing, as soon as L&T Realty releases them after registration. Registering is free and does not reserve a unit."

