# Asset inventory for M3M Brabus, Sector 58. Every file in images/ must be listed here.
#
# Placeholders: noir-graded copies of the owner-supplied AI interiors (also used,
# ungraded, on the L&T page). Conceptual only: always "Representative image".
#
# When M3M's channel partner kit arrives, add its files here with
# fromDeveloper: true, license: authorized, licenseProof: <agreement ref>:
#   - M3M / BRABUS logo: kind logo (add onDark: true for a white version)
#   - renders: kind render, caption "Artist's impression"
#   - master plan / floor plans: kind plan, usage [plan]
# Do NOT add images copied from agent sites (brabusindia.com, brabusresidence.com,
# m3mproperties.com are run by other channel partners).

