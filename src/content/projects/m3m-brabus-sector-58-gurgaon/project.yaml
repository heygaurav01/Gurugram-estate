faqs:
  - q: "Is M3M Brabus RERA registered?"
    a: "{{rera_status}} You can check any project yourself on the Haryana RERA website, haryanarera.gov.in."
  - q: "Who is developing M3M Brabus, Sector 58?"
    a: "M3M India, with BRABUS, the German luxury car specialist, as the brand partner."
  - q: "I have seen prices quoted online. Are they official?"
    a: "Not from us. The project is not registered with HARERA yet, and under the RERA Act it cannot be priced or marketed until it is. We will share M3M's official price list only after registration."
  - q: "Do I need to pay anything to register interest?"
    a: "No. Registering interest is free and does not reserve a unit."
  - q: "When will floor plans and the master plan be available?"
    a: "After the project is registered with HARERA and M3M releases official details. We will share them with registered contacts first."
  - q: "Who are you?"
    a: "{{agent_disclosure}} We help buyers compare projects, arrange site visits and handle paperwork."
  - q: "How do I verify a project's RERA registration?"
    a: "Open haryanarera.gov.in and use the project search. Search by project name, developer or registration number. Check that the registration number, developer name and project address match what you were told."
  - q: "Where is Sector 58?"
    a: "Sector 58 is in Gurugram, Haryana, on Golf Course Extension Road. We will add travel times here only after we have measured and dated them."

