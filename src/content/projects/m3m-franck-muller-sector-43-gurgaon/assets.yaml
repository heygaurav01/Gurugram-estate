# Asset inventory for M3M Franck Muller, Sector 43. Every file in images/ must be listed here.
#
# Kit images: supplied in the owner's M3M channel partner kit (owner confirmed
# 2026-10-21). None is confirmed to show the Sector 43 project:
#   - the twin-tower dusk render is a concept image (agent sites call it that too)
#   - the Aeternitas images show Franck Muller's tower in Dubai Marina
# So every one is captioned "Representative image".
#
# Not used, on purpose:
#   - "master-plan-47796-36735.jpg": a large multi-block township, not a two-tower site
#   - "site-plan-image-99056-73374.jpg": a "Site plan coming soon" placeholder
#   - "The Dubai Lifestyle" / "Philosophy" text banners: Dubai marketing, misleading here
#   - prestige-group.in images: Prestige material, not M3M's
# When M3M releases official Sector 43 renders or plans, add them with
# fromDeveloper: true, license: authorized, licenseProof: <agreement ref>.

assets:
  - id: m3m-logo
    file: m3m-logo.png
    alt: "M3M logo"
    kind: logo
    fromDeveloper: true
    license: authorized
    licenseProof: "TBD: M3M channel partner kit reference"
    source: "M3M India, supplied in the M3M channel partner kit (owner, 2026-10-21)"
    usage: [developer]

  - id: m3m-logo-tile
    file: m3m-logo-light.png
    alt: "M3M logo"
    kind: logo
    fromDeveloper: true
    onDark: true
    license: authorized
    licenseProof: "TBD: M3M channel partner kit reference"
    source: "The kit logo on a white tile, for dark backgrounds (owner, 2026-10-21)"
