faqs:
  - q: "Is M3M Franck Muller RERA registered?"
    a: "{{rera_status}} You can check any project yourself on the Haryana RERA website, haryanarera.gov.in."
  - q: "Who is developing M3M Franck Muller, Sector 43?"
    a: "M3M India, with Franck Muller, the Swiss luxury watchmaker, as the brand partner."
  - q: "Websites quote different land sizes, unit counts and prices. Which is right?"
    a: "None of them is official yet. The project is not registered with HARERA, and under the RERA Act it cannot be priced or marketed until it is. We will share M3M's official figures, plans and price list only after registration."
  - q: "Do I need to pay anything to register interest?"
    a: "No. Registering interest is free and does not reserve a unit."
  - q: "When will floor plans and the master plan be available?"
    a: "After the project is registered with HARERA and M3M releases official details. We will share them with registered contacts first."
  - q: "Are the tower images on this page the actual project?"
    a: "No. They are a concept render and Franck Muller's Aeternitas tower in Dubai, shown for mood. Every image is labeled. Official M3M renders will replace them once released."
  - q: "Who are you?"
    a: "{{agent_disclosure}} We help buyers compare projects, arrange site visits and handle paperwork."
  - q: "Where is Sector 43?"
    a: "Sector 43 is in Gurugram, Haryana, off Golf Course Road. We will add travel times here only after we have measured and dated them."

