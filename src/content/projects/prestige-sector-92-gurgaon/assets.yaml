# Asset inventory for Prestige Sector 92. Every file in images/ must be listed here.
#
# Kit images: supplied in the owner's Prestige channel partner kit (owner confirmed
# 2026-10-20). None show the Sector 92 project, which has no official images yet,
# so every one is captioned "Representative image".
# Do NOT add images copied from agent sites (prestige-group.in, prestigegurgaon.com,
# rightsolutions are run by other channel partners), and never M3M's plans.
#
# When Prestige releases official Sector 92 material, add it here with
# fromDeveloper: true, license: authorized, licenseProof: <agreement ref>:
#   - renders: kind render, caption "Artist's impression", projectSpecific: true
#   - master plan / floor plans: kind plan, usage [plan]

