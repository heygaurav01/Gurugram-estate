faqs:
  - q: "Is Prestige Sector 92 RERA registered?"
    a: "{{rera_status}} You can check any project yourself on the Haryana RERA website, haryanarera.gov.in."
  - q: "Who is developing the Sector 92 project?"
    a: "Prestige Estates Projects Ltd, part of Prestige Group. It signed a joint development agreement for the 17.212 acre land parcel in April 2026, as disclosed to the National Stock Exchange."
  - q: "How large is the project?"
    a: "Prestige's filing puts the land at 17.212 acres and the estimated saleable area at about 3 million sq ft. Tower counts, unit counts and home sizes have not been announced."
  - q: "I have seen prices and floor plans online. Are they official?"
    a: "Not from us. The project is not registered with HARERA yet, and under the RERA Act it cannot be priced or marketed until it is. We will share Prestige's official price list and plans only after registration."
  - q: "Do I need to pay anything to register interest?"
    a: "No. Registering interest is free and does not reserve a unit."
  - q: "Where is Sector 92?"
    a: "Sector 92 is in Gurugram, Haryana. Prestige's filing describes the land as being in close proximity to the Dwarka Expressway. We will add travel times here only after we have measured and dated them."
  - q: "Who are you?"
    a: "{{agent_disclosure}} We help buyers compare projects, arrange site visits and handle paperwork."
  - q: "How do I verify a project's RERA registration?"
    a: "Open haryanarera.gov.in and use the project search. Search by project name, developer or registration number, and check that the details match what you were told."

