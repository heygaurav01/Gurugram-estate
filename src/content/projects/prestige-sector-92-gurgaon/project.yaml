overview:
  title: "A new Prestige address in Sector 92"
  body:
    - "On 1 April 2026, Prestige Estates Projects Ltd told the National Stock Exchange that it had signed a joint development agreement for a 17.212 acre land parcel in Sector 92, Gurugram. The filing describes a residential community in close proximity to the Dwarka Expressway, with an estimated saleable area of about 3 million sq ft."
    - "The project is not yet registered with HARERA, and Prestige has not released a project name, home types, sizes, prices or plans. Until it does, this page lists only what Prestige has stated on record, each item with its source."
    - "Gurugram Estate Pvt Ltd is an authorized channel partner of Prestige Group. Register interest and we will share Prestige's official details, including plans and pricing, as soon as they are released after registration. Registering is free and does not reserve a unit."

