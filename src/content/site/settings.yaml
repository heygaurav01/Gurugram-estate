# Site-wide business settings. Mirrors section 0 of the master prompt.
# "TBD" values render as hidden or "On request" and are listed by `npm run check`.
# A production build fails while launch-critical values are TBD or dummy.
# Never put secrets here: this file is public. Secrets go in Cloudflare env vars.

business:
  brand_name: "Gurugram Estate Pvt Ltd" # name shown across the site (owner, 2026-10-20)
  legal_name: "Gurugram Estate Private Limited" # as on the official logo; homepage + legal lines
  company_logo_file: "/brand/gurugram-estate-mark.png" # official GE mark (full logo: /brand/gurugram-estate-logo.png)
  agent_rera_number: "TBD" # HARERA agent registration number
  phone_display: "+91 99588 33329"
  phone_e164: "+919958833329"
  whatsapp_e164: "+919958833329"
  email: "support@gurugramestatepvtltd.in" # owner, 2026-11-04; job applications are emailed here
  office_address: "Office No. 2018, Tower A, DLF Corporate Greens, Sector 74A, Gurugram, Haryana 122004" # owner's visiting card, 2026-11-06
  # Search engine details (structured data). Keep identical to the Google Business Profile.
  office_address_parts:
    street: "Office No. 2018, Tower A, DLF Corporate Greens, Sector 74A"
    locality: "Gurugram"
    region: "Haryana"
    postal_code: "122004"
  founding_date: "2019-11-01" # incorporation date, MCA records (CIN U70103HR2019PTC083367)
  # Official profiles of the company. Add Instagram/YouTube only if they are company accounts.
  same_as:
    - "https://www.facebook.com/gurugramestatepvtlimited/"
    - "https://in.linkedin.com/company/gurugram-estates-pvt-ltd"
  grievance_officer_name: "TBD" # privacy policy (DPDP Act)
  grievance_officer_email: "TBD"
  logo_file: "TBD" # path to SVG/PNG in public/, or TBD for text wordmark
  brand_accent_hex: "#8C6A3F"

site:
  domain: "gurugramestatepvtltd.in"
  hosting: "cloudflare-pages"
  # callback_promise: "within 2 working hours"   # set ONLY if the team can always hit it

# Job openings on /careers/. Remove an opening here when it is filled; with none
# left, the homepage hiring strip and button disappear.
careers:
  openings:
    - slug: "digital-editor"
      title: "Digital editor"
      summary: "Create and edit content for our website, ads and social media."
    - slug: "sales"
      title: "Sales"
      summary: "Sell flats and residential units across our real estate projects in Gurugram, from the first client meeting and site visit through to closing the sale."

# Public tracking IDs (safe to publish). Never send name, phone or email to these.
analytics:
  meta_pixel_id: "2009668023753276" # Meta Events Manager, dataset created 2026-11-12

leads:
  crm: "TBD" # frappe | espocrm | krayin | none
  notify_email: "TBD"
  otp_enabled: false
