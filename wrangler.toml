# Cloudflare Pages configuration. Functions live in /functions.
name = "gurgaon-properties"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

# D1 lead store. Create with: npx wrangler d1 create gurgaon-properties-leads
# then paste the returned database_id below (Phase 3).
[[d1_databases]]
binding = "DB"
database_name = "gurgaon-properties-leads"
database_id = "REPLACE_AFTER_wrangler_d1_create"
migrations_dir = "migrations"
